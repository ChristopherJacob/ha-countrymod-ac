name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component ruff pillow
      - name: Lint
        run: ruff check custom_components tests tools
      - name: Format check
        run: ruff format --check custom_components tests tools
      - name: Tests
        run: pytest -q
      - name: Brand asset spec
        run: python tools/check_brand_assets.py custom_components/countrymod_ac/brand
